name: Snake

# Regenerates the contribution-graph snake every day and publishes it to the
# `output` branch, which the README reads the SVGs from.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#c19350&color_dots=#eeefe9,#c9d3df,#93a8c2,#5b7aa0,#203d66
            dist/github-snake-dark.svg?color_snake=#d6b27b&color_dots=#1f2d3c,#2a4058,#46658b,#6f93c0,#a7c8ef

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
